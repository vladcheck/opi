version: "2"

linters:
  default: all
  disable:
    - wsl
    - exhaustruct
    - gomodguard
  exclusions:
    warn-unused: true
    rules:
      - linters:
          - revive
        text: "package-comments: should have a package comment"
      - linters:
          - gochecknoglobals
        path: ".*/debug\\.go$"
  settings:
    exhaustive:
      explicit-exhaustive: true
    varnamelen:
      max-distance: 10
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
    mnd:
      checks:
        - condition
        - return
    exhaustruct_v5:
      allow-empty: true
    depguard:
      rules:
        main:
          list-mode: "lax"
          allow:
            - $gostd
            - vladcheck/opi

formatters:
  enable:
    - gofumpt
